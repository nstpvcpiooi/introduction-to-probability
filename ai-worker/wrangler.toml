name = "book-web-ai-guide"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Model dùng khi client không gửi kèm field "model" trong request.
AI_MODEL = "bee/gemini-3.6-flash"
# Origin của trang GitHub Pages — chỉ origin này mới được phép gọi worker (CORS).
# Đổi thành domain thật trước khi deploy, ví dụ "https://<username>.github.io".
ALLOWED_ORIGIN = "http://localhost:5173"

# Tạo bằng: wrangler kv namespace create RATE_LIMIT_KV
# rồi dán "id" trả về vào đây. Dùng để đếm số request/IP, chặn lạm dụng.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "281576a4edd74e4cba4826de111bd110"
